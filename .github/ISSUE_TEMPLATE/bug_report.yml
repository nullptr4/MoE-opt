name: Bug 报告
description: 报告可复现的代码、脚本、数据或文档问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 请先移除凭据、私有数据和未经脱敏的 profiler 输出。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 说明实际行为、预期行为和影响。
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit 或分支
      placeholder: c19a7cd 或 main
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 包含 GPU/显存、MACA、Python、PyTorch、TileLang 和容器版本。
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或错误信息
      description: 请脱敏；大型文件请提供受控链接或归档清单。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我确认内容中没有密钥、令牌或私有数据。
          required: true
